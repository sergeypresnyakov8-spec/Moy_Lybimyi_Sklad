<html lang="en">

    <meta charset="UTF-8" />

    <meta name="theme-color" content="#18181b" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Склад" />
    
    <link rel="apple-touch-icon" href="./icon-512.png" />
    <link rel="manifest" href="./manifest.json" />
    
    <title>Учет склада • PWA</title>
    
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          // Use relative registration path to support GitHub Pages subdomains seamlessly
          const basePath = window.location.pathname.endsWith('/') 
            ? window.location.pathname 
            : window.location.pathname.substring(0, window.location.pathname.lastIndexOf('/') + 1);
          
          navigator.serviceWorker.register(basePath + 'service-worker.js')
            .then((reg) => console.log('PWA Service Worker registered at scope: ', reg.scope))
            .catch((err) => console.error('PWA Service Worker registration failed: ', err));
        });
      }
    </script>
    <script type="module" crossorigin src="./assets/index-MlUA0iwR.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-C_J9HUdD.css">
  </head>

    <div id="root"></div>
  </body>
