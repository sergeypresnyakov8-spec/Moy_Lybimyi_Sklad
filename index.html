<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#18181b" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Склад" />
    
    <link rel="apple-touch-icon" href="./icon-512.png" />
    <link rel="manifest" href="./manifest.json" />
    
    <title>Учет склада • PWA</title>
    
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          const basePath = window.location.pathname.endsWith('/') 
            ? window.location.pathname 
            : window.location.pathname.substring(0, window.location.pathname.lastIndexOf('/') + 1);
          
          navigator.serviceWorker.register(basePath + 'service-worker.js')
            .then((reg) => console.log('PWA Service Worker registered at scope: ', reg.scope))
            .catch((err) => console.error('PWA Service Worker registration failed: ', err));
        });
      }
    </script>
    <script type="module" crossorigin src="./assets/index-BLNDm5h9.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-C7pv5f53.css">
  </head>
  <body>
    <div id="root"></div>

    <!-- СКРИПТ АВТОМАТИЧЕСКОЙ ЗАГРУЗКИ ДАННЫХ ИЗ GOOGLE SHEETS -->
    <script>
      (function autoRefresh() {
        // Ждём, пока React-приложение отрендерит кнопку "Обновить"
        let attempts = 0;
        const maxAttempts = 30; // максимум попыток (≈ 15 секунд)
        const checkInterval = setInterval(() => {
          attempts++;
          // Ищем кнопку обновления по атрибуту id или по тексту/иконке
          const refreshButton = document.querySelector(
            '#header-sync-down, button:has(svg.lucide-refresh-cw), button:has(.lucide-refresh-cw)'
          );

          if (refreshButton) {
            clearInterval(checkInterval);
            // Небольшая задержка, чтобы все обработчики событий успели привязаться
            setTimeout(() => {
              refreshButton.click();
              console.log('✅ Автоматическая синхронизация с Google Таблицей запущена');
            }, 400);
          } else if (attempts >= maxAttempts) {
            clearInterval(checkInterval);
            console.warn('⚠️ Кнопка обновления не найдена. Возможно, приложение не загрузилось.');
          }
        }, 500);
      })();
    </script>
  </body>
</html>
